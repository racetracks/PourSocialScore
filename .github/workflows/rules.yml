# Runs tools/check_rules.sh (Lua 5.1, ASCII only, tab indentation), the
# harness's window checks, and validate_all.sh (upgrades, data, on demand,
# growth; no real saves here) on every pull request and every push to main,
# plus an informational window compare and, with a scratch token, the real saves.
name: Rules

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1
      - name: Check rules
        run: sh tools/check_rules.sh
        env:
          PSS_PR: ${{ github.event.pull_request.number }}

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1
      - name: New window checks
        run: lua5.1 tools/harness/run.lua . - - tools/harness/check_tui.lua | tee /tmp/tui.txt && grep -q "PASS tui" /tmp/tui.txt
      - name: New window maths
        run: lua5.1 tools/harness/run.lua . - - tools/harness/check_viewquery.lua | tee /tmp/vq.txt && grep -q "PASS viewquery" /tmp/vq.txt
      - name: New window Players tab
        run: lua5.1 tools/harness/run.lua . - - tools/harness/check_players.lua | tee /tmp/pl.txt && grep -q "PASS players" /tmp/pl.txt
      - name: New window right-click menus
        run: lua5.1 tools/harness/run.lua . - - tools/harness/check_menus.lua | tee /tmp/mn.txt && grep -q "PASS menus" /tmp/mn.txt
      - name: New window Guilds tab
        run: lua5.1 tools/harness/run.lua . - - tools/harness/check_guilds.lua | tee /tmp/gu.txt && grep -q "PASS guilds" /tmp/gu.txt
      - name: New window Chat Filters tab
        run: lua5.1 tools/harness/run.lua . - - tools/harness/check_filters.lua | tee /tmp/fi.txt && grep -q "PASS filters" /tmp/fi.txt
      - name: New window Events tab
        run: lua5.1 tools/harness/run.lua . - - tools/harness/check_events.lua | tee /tmp/ev.txt && grep -q "PASS events" /tmp/ev.txt
      - name: New window Options and Import/Export tabs
        run: lua5.1 tools/harness/run.lua . - - tools/harness/check_options.lua | tee /tmp/op.txt && grep -q "PASS options" /tmp/op.txt
      - name: Secret values
        run: lua5.1 tools/harness/run.lua . - - tools/harness/check_secrets.lua | tee /tmp/se.txt && grep -q "PASS secrets" /tmp/se.txt
      - name: Graphics settings
        run: |
          for ph in logic history keep popup history_ui; do
            PSS_PHASE=$ph PSS_CAMELOT=1 lua5.1 tools/harness/run.lua . - - tools/harness/check_gfx.lua | tee /tmp/gfx.txt && grep -q "PASS gfx $ph" /tmp/gfx.txt
          done
          PSS_PHASE=retail lua5.1 tools/harness/run.lua . - - tools/harness/check_gfx.lua | tee /tmp/gfx.txt && grep -q "PASS gfx retail" /tmp/gfx.txt
          PSS_GFX_NOAPI=1 PSS_PHASE=noapi PSS_CAMELOT=1 lua5.1 tools/harness/run.lua . - - tools/harness/check_gfx.lua | tee /tmp/gfx.txt && grep -q "PASS gfx noapi" /tmp/gfx.txt
          PSS_GFX_OLDAPI=1 PSS_PHASE=noapi PSS_CAMELOT=1 lua5.1 tools/harness/run.lua . - - tools/harness/check_gfx.lua | tee /tmp/gfx.txt && grep -q "PASS gfx noapi" /tmp/gfx.txt
      - name: Macro helper
        run: |
          for ph in data global wrongclass dynicon combat list login memory; do
            PSS_PHASE=$ph PSS_CAMELOT=1 lua5.1 tools/harness/run.lua . - - tools/harness/check_macro.lua | tee /tmp/mac.txt && grep -q "PASS macro $ph" /tmp/mac.txt
          done
          for ph in class stores; do
            PSS_PHASE=$ph PSS_CAMELOT=1 PSS_CLASS=WARRIOR lua5.1 tools/harness/run.lua . - - tools/harness/check_macro.lua | tee /tmp/mac.txt && grep -q "PASS macro $ph" /tmp/mac.txt
          done
          PSS_PHASE=existing PSS_CAMELOT=1 PSS_MACRO_SEED="a:Trinket 1=/say hi;a:Other=/dance;c:Trinket 2=/say char" lua5.1 tools/harness/run.lua . - - tools/harness/check_macro.lua | tee /tmp/mac.txt && grep -q "PASS macro existing" /tmp/mac.txt
          PSS_PHASE=full PSS_CAMELOT=1 PSS_MACRO_MAX=1,18 PSS_MACRO_SEED="a:Keep=/x" lua5.1 tools/harness/run.lua . - - tools/harness/check_macro.lua | tee /tmp/mac.txt && grep -q "PASS macro full" /tmp/mac.txt
          PSS_PHASE=full PSS_CAMELOT=1 PSS_MACRO_MAX=2,18 PSS_MACRO_SEED="a:Keep=/x" lua5.1 tools/harness/run.lua . - - tools/harness/check_macro.lua | tee /tmp/mac.txt && grep -q "PASS macro full" /tmp/mac.txt
          PSS_PHASE=dynicon PSS_CAMELOT=1 PSS_MACRO_DYNICON=1 lua5.1 tools/harness/run.lua . - - tools/harness/check_macro.lua | tee /tmp/mac.txt && grep -q "PASS macro dynicon" /tmp/mac.txt
          PSS_PHASE=noapi PSS_CAMELOT=1 PSS_MACRO_NOAPI=1 lua5.1 tools/harness/run.lua . - - tools/harness/check_macro.lua | tee /tmp/mac.txt && grep -q "PASS macro noapi" /tmp/mac.txt
          PSS_PHASE=retail lua5.1 tools/harness/run.lua . - - tools/harness/check_macro.lua | tee /tmp/mac.txt && grep -q "PASS macro retail" /tmp/mac.txt
      - name: Addon manager
        run: sh tools/harness/addons_phases.sh /tmp/pss-addons
      - name: Enabled components
        run: sh tools/harness/components_phases.sh /tmp/pss-components

  upgrades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1
      - name: Upgrades and data checks
        run: PSS_SPARSE_AS="${{ vars.PSS_SPARSE_AS }}" sh tools/harness/validate_all.sh

  # Informational: the window against the branch it merges into, in all three
  # looks. A change that should not show must read "identical"; an intended
  # change lists its lines. The job always passes (a failing job would show a
  # red cross on a PR whose difference is intended): a difference is a warning
  # annotation and the full text is in the job summary.
  window-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1
      - name: Window against the base branch
        run: |
          base=origin/${{ github.base_ref || 'main' }}
          rc=0
          sh tools/harness/tui_compare.sh "$base" > "$RUNNER_TEMP/tui.txt" 2>&1 || rc=$?
          { echo '### Window against '"$base"; echo '```'; tail -45 "$RUNNER_TEMP/tui.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tail -3 "$RUNNER_TEMP/tui.txt"
          if [ "$rc" != 0 ]; then echo "::warning::The window differs from $base (intended? see the job summary)"; fi

  # The real saves live on the private scratch repo and are never committed
  # here (baseline 02 D10). With a SCRATCH_TOKEN secret (contents: read on
  # racetracks/Pour-Social-Score_Scratch) the full harness runs on them; without
  # one (forks, or no secret yet) the job says so and passes.
  real-saves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1
      - name: Check for the scratch token
        id: t
        env:
          T: ${{ secrets.SCRATCH_TOKEN }}
        run: |
          if [ -n "$T" ]; then echo "have=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No SCRATCH_TOKEN secret: the real-save run is local only"; fi
      - name: Build the real saves from scratch
        if: steps.t.outputs.have == 'true'
        env:
          T: ${{ secrets.SCRATCH_TOKEN }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${T}@github.com/racetracks/Pour-Social-Score_Scratch" "$RUNNER_TEMP/scratch"
          sh tools/harness/build_saves.sh "$RUNNER_TEMP/scratch" "$RUNNER_TEMP/saves"
      - name: Full harness on the real saves
        if: steps.t.outputs.have == 'true'
        run: PSS_REAL_SAVES="$RUNNER_TEMP/saves" PSS_SPARSE_AS="${{ vars.PSS_SPARSE_AS }}" sh tools/harness/validate_all.sh
