# Core caller of .github/workflows/package-release.yml:1, whose header holds the
# behaviour (version, gates, zip, notes, release, mirror).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the mirror up to git push --dry-run; no release
        type: boolean
        default: false

permissions:
  contents: write

env:
  MIRROR_REPO: racetracks/Pour-Social-Score   # where full releases are mirrored

jobs:
  core:
    uses: ./.github/workflows/package-release.yml
    with:
      package: core
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      mirror_token: ${{ secrets.MIRROR_TOKEN }}
