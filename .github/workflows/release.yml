# Publishes a GitHub release whenever the version in PourSocialScore/PourSocialScore.toc
# changes on main: tags v<version> and attaches PourSocialScore-<version>.zip
# (every addon folder, PourSocialScore and PourSocialScore_*, with readme.txt and
# history.txt in the core folder; no .github / tools), with that version's section
# of history.txt as the release notes. Does nothing if the release exists.
# Every version is X.Y.Z.B (B = the build number, which never resets; a
# release is a build too, Dan, 2026-10-08). versions.json (tools/versions.py,
# never shipped) says what each one is: the latest release, or a pre-release
# recorded with its PR. A version it does not record is not published.
# A full release's notes are its history.txt section only: one summary of
# every change since the previous release, written at release time from the
# PRs versions.json lists between the two (CLAUDE.md, Full releases). Job
# "mirror" then publishes the full release, with the same zip and notes, on
# $MIRROR_REPO (secret MIRROR_TOKEN: contents read and write on that repo).
# Pre-releases are not mirrored.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  MIRROR_REPO: racetracks/Pour-Social-Score   # where full releases are mirrored

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      kind: ${{ steps.v.outputs.kind }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          ver=$(sed -n 's/^## Version: *//p' PourSocialScore/PourSocialScore.toc | tr -d '\r')
          kind=$(python3 tools/versions.py kind "$ver")
          if [ "$kind" = unknown ]; then
            echo "::error::$ver is not in versions.json (sh tools/bump_version.sh records it)"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build zip and notes
        if: steps.v.outputs.exists == 'false'
        run: |
          ver=${{ steps.v.outputs.version }}
          mkdir -p build
          for d in PourSocialScore PourSocialScore_*/; do
            if [ -d "$d" ]; then cp -r "${d%/}" build/; fi
          done
          cp readme.txt history.txt build/PourSocialScore/
          (cd build && zip -qr "../PourSocialScore-$ver.zip" .)
          {
            echo "**Install:** extract the zip into \`World of Warcraft/_retail_/Interface/AddOns/\` so you get \`AddOns/PourSocialScore/PourSocialScore.toc\` (and any \`AddOns/PourSocialScore_*\` folders next to it). Retail (Midnight) and Camelot are supported."
            echo
            if [ "${{ steps.v.outputs.kind }}" = release ]; then
              prev=$(python3 -c 'import json; print(json.load(open("versions.json"))["releases"][0]["previous"])')
              echo "### Changes since $prev"
            else
              echo "### Changes"
            fi
            awk -v v="$ver" '
              index($0, "=> " v " ") == 1 { on = 1; next }
              on && /^=> / { exit }
              on { print }
            ' history.txt
            echo
            echo "Full changelog: history.txt"
          } > notes.md
          cat notes.md

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        run: |
          ver=${{ steps.v.outputs.version }}
          pre="--latest"
          [ "${{ steps.v.outputs.kind }}" = release ] || pre="--prerelease"
          gh release create "v$ver" "PourSocialScore-$ver.zip" $pre \
            --target "$GITHUB_SHA" --title "Pour Social Score $ver" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Keep pre-releases marked as pre-releases
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease | not) | .tagName' |
          while read -r tag; do
            v=${tag#v}
            case "$v" in *-*) gh release edit "$tag" --prerelease; continue ;; esac
            if [ "$(python3 tools/versions.py kind "$v")" = pre-release ]; then gh release edit "$tag" --prerelease; fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

  mirror:
    needs: release
    if: ${{ needs.release.outputs.kind == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the version and the mirror
        id: m
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a MIRROR_TOKEN secret with contents read and write on $MIRROR_REPO"
            exit 1
          fi
          if gh release view "v$VER" --repo "$MIRROR_REPO" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          VER: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}

      - name: Fetch the zip and notes
        if: steps.m.outputs.skip == 'false' && steps.m.outputs.exists == 'false'
        run: |
          gh release download "v$VER" --repo "$GITHUB_REPOSITORY" --pattern "PourSocialScore-$VER.zip"
          gh release view "v$VER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
        env:
          VER: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}

      - name: Publish on the mirror
        if: steps.m.outputs.skip == 'false' && steps.m.outputs.exists == 'false'
        run: |
          gh release create "v$VER" "PourSocialScore-$VER.zip" --repo "$MIRROR_REPO" \
            --title "Pour Social Score $VER" --notes-file notes.md --latest
        env:
          VER: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
