# Publishes a GitHub release whenever the version in PourSocialScore/PourSocialScore.toc
# changes on main: tags vX.Y.Z and attaches PourSocialScore-X.Y.Z.zip
# (every addon folder, PourSocialScore and PourSocialScore_*, with readme.txt and
# history.txt in the core folder; no .github / tools), with that version's section
# of history.txt as the release notes. Does nothing if the release exists.
# Versions with a suffix (3.0.0-dev1) are published as, or turned into, pre-releases.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          ver=$(sed -n 's/^## Version: *//p' PourSocialScore/PourSocialScore.toc | tr -d '\r')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build zip and notes
        if: steps.v.outputs.exists == 'false'
        run: |
          ver=${{ steps.v.outputs.version }}
          mkdir -p build
          for d in PourSocialScore PourSocialScore_*/; do
            if [ -d "$d" ]; then cp -r "${d%/}" build/; fi
          done
          cp readme.txt history.txt build/PourSocialScore/
          (cd build && zip -qr "../PourSocialScore-$ver.zip" .)
          # Only addon folders ship: fail if anything else (CLAUDE.md, .github,
          # tools) reached the zip.
          bad=$(unzip -Z1 "PourSocialScore-$ver.zip" | grep -v '^PourSocialScore[^/]*/' || true)
          if [ -n "$bad" ]; then
            echo "Not an addon folder file, refusing to release:"
            echo "$bad"
            exit 1
          fi
          {
            echo "**Install:** extract the zip into \`World of Warcraft/_retail_/Interface/AddOns/\` so you get \`AddOns/PourSocialScore/PourSocialScore.toc\` (and any \`AddOns/PourSocialScore_*\` folders next to it). Retail (Midnight) and Camelot are supported."
            echo
            echo "### Changes"
            awk -v v="$ver" '
              index($0, "=> " v " ") == 1 { on = 1; next }
              on && /^=> / { exit }
              on { print }
            ' history.txt
            echo
            echo "Full changelog: history.txt"
          } > notes.md

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        run: |
          ver=${{ steps.v.outputs.version }}
          pre=""
          case "$ver" in *-*) pre="--prerelease" ;; esac
          gh release create "v$ver" "PourSocialScore-$ver.zip" $pre \
            --target "$GITHUB_SHA" --title "Pour Social Score $ver" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Mark suffixed releases as pre-releases
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease | not) | .tagName | select(contains("-"))' |
          while read -r tag; do gh release edit "$tag" --prerelease; done
        env:
          GH_TOKEN: ${{ github.token }}
