# Publishes a GitHub release whenever the version in PourSocialScore.toc
# changes on main: tags vX.Y.Z and attaches PourSocialScore-X.Y.Z.zip
# (the addon folder incl. Bindings.xml, without .github / tools), with that version's section
# of history.txt as the release notes. Does nothing if the release exists.
# Versions with a suffix (3.0.0-dev1) are published as pre-releases.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          ver=$(sed -n 's/^## Version: *//p' PourSocialScore.toc | tr -d '\r')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build zip and notes
        if: steps.v.outputs.exists == 'false'
        run: |
          ver=${{ steps.v.outputs.version }}
          mkdir -p build/PourSocialScore
          cp *.lua *.toc Bindings.xml readme.txt history.txt build/PourSocialScore/
          (cd build && zip -qr "../PourSocialScore-$ver.zip" PourSocialScore)
          {
            echo "**Install:** extract the zip into \`World of Warcraft/_retail_/Interface/AddOns/\` so you get \`AddOns/PourSocialScore/PourSocialScore.toc\`. Retail (Midnight) and Camelot are supported."
            echo
            echo "### Changes"
            awk -v v="$ver" '
              index($0, "=> " v " ") == 1 { on = 1; next }
              on && /^=> / { exit }
              on { print }
            ' history.txt
            echo
            echo "Full changelog: history.txt"
          } > notes.md

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        run: |
          ver=${{ steps.v.outputs.version }}
          pre=""
          case "$ver" in *-*) pre="--prerelease" ;; esac
          gh release create "v$ver" "PourSocialScore-$ver.zip" $pre \
            --target "$GITHUB_SHA" --title "Pour Social Score $ver" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Mark an existing suffixed release as pre-release
        if: steps.v.outputs.exists == 'true' && contains(steps.v.outputs.version, '-')
        run: gh release edit "v${{ steps.v.outputs.version }}" --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
